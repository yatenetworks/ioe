module_id: local.example.basic
template_version: 1
name: Local Example Basic Module
description: Minimal local module template example for IOE public documentation.
source:
  type: local
  path: templates/modules/local.example.basic
license: MIT
runtime:
  adapter: docker-compose
  compose_file: docker-compose.yml
resource_profile:
  cpu_min: 1
  ram_mb_min: 256
  disk_mb_min: 256
  accelerator_required: false
ports:
  - name: http
    host_port: 18081
    container_port: 8080
    public: false
storage:
  data_root: ${IOE_DATA_DIR:-~/ioe-data}
  app_data: apps/local.example.basic/
  backups: backups/local.example.basic/
models: []
lifecycle:
  healthcheck: healthcheck.sh
healthchecks:
  mode: all
  checks:
    - name: http
      type: http
      url: http://127.0.0.1:18081/health
      timeout_seconds: 10
logging:
  default_tail: 100
  sources:
    - type: docker-compose
      service: app
cleanup_policy:
  preserve_data_by_default: true
  destructive_cleanup_requires_confirmation: true
security_policy:
  needs_root: false
  needs_docker_socket: false
  privileged: false
  public_exposure: false
extensions: {}
