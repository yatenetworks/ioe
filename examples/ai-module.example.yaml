module_id: translation.basic
template_version: 1
name: Basic Translation Module
description: Example low-risk AI application module manifest.
source:
  type: image
  url: example/translation-module:latest
license: MIT
capabilities:
  - capability.translation.text
resource_profile:
  cpu_min: 1
  ram_mb_min: 512
  disk_mb_min: 512
  gpu_required: false
lifecycle_mode: standby
healthcheck:
  type: http
  path: /health
  port: 8080
security_policy:
  risk_class: digital_only
  needs_root: false
  needs_docker_socket: false
  public_exposure: false
recovery_policy:
  restart: true
  recreate: true
  restore_from_backup: false
  reinstall: true
  max_attempts: 3
  backoff_seconds: 10
cleanup_policy:
  destroy_after_complete: false
  standby_after_complete: true
  cleanup_temp_files: true
extensions: {}
