name: Template contribution proposal
description: Propose a new or improved AI application environment template (draft/testing until reviewed).
title: "[Template Contribution]: "
labels:
  - template-contribution
body:
  - type: markdown
    attributes:
      value: |
        Propose a new or updated IOE-compatible AI application environment template.

        Contributions start as **draft/testing** until reviewed and tested. See `docs/AI_APP_TEMPLATE_CONTRIBUTION_GUIDE.md` in the repository.

        Do not paste secrets, API keys, or private `.env` files.

  - type: input
    id: template_name
    attributes:
      label: Template name / module id
      placeholder: e.g. ollama.basic
    validations:
      required: true

  - type: input
    id: upstream_repo
    attributes:
      label: Upstream repository URL
    validations:
      required: true

  - type: textarea
    id: what_changes
    attributes:
      label: What this template adds or changes
    validations:
      required: true

  - type: dropdown
    id: runtime_method
    attributes:
      label: Runtime method
      options:
        - docker compose
        - docker
        - other
    validations:
      required: true

  - type: textarea
    id: ports
    attributes:
      label: Ports
      placeholder: Documented host/container ports
    validations:
      required: true

  - type: textarea
    id: volumes
    attributes:
      label: Volumes / data paths
    validations:
      required: true

  - type: textarea
    id: env_vars
    attributes:
      label: Environment variables
      description: List variables and whether they are in `.env.example` with placeholders only.
    validations:
      required: true

  - type: textarea
    id: healthcheck
    attributes:
      label: Health check
      description: How readiness is verified (e.g. healthcheck.sh, HTTP path).
    validations:
      required: false

  - type: textarea
    id: tested_commands
    attributes:
      label: Tested commands
      description: Which lifecycle commands you ran on which OS.
      placeholder: validate, install, start, status, logs, stop, remove
    validations:
      required: true

  - type: textarea
    id: known_limitations
    attributes:
      label: Known limitations
    validations:
      required: false

  - type: textarea
    id: security_notes
    attributes:
      label: Security notes
      description: Privileges, exposed ports, downloads, or destructive behavior.
    validations:
      required: true

  - type: dropdown
    id: secrets_required
    attributes:
      label: Are any secrets required?
      options:
        - "no"
        - "yes (documented in .env.example placeholders only)"
    validations:
      required: true

  - type: dropdown
    id: root_required
    attributes:
      label: Is root required beyond normal Docker install?
      options:
        - "no"
        - "yes (explain)"
    validations:
      required: true

  - type: dropdown
    id: draft_only
    attributes:
      label: Template status
      options:
        - draft / testing only
        - tested on one supported OS
        - ready for maintainer review toward verified
    validations:
      required: true
