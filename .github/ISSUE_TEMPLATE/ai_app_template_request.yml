name: AI app template request
description: Request support for a new AI application environment template (not a verified template).
title: "[Template Request]: "
labels:
  - template-request
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest an AI application that may benefit from an IOE-compatible template.

        **This is a request only.** IOE does not promise to add every app. A request is not a verified or tested template.

        For contributing an actual template, use the **Template contribution proposal** issue instead.

  - type: input
    id: app_name
    attributes:
      label: App name
      placeholder: e.g. Ollama, Open WebUI
    validations:
      required: true

  - type: input
    id: upstream_repo
    attributes:
      label: Upstream repository URL
      placeholder: https://github.com/org/project
    validations:
      required: true

  - type: input
    id: upstream_docs
    attributes:
      label: Upstream documentation URL
      placeholder: https://...
    validations:
      required: false

  - type: dropdown
    id: deployment_method
    attributes:
      label: Deployment method observed
      options:
        - docker compose
        - docker
        - python
        - node
        - other
    validations:
      required: true

  - type: checkboxes
    id: required_services
    attributes:
      label: Required services (check all that apply)
      options:
        - label: database
        - label: vector database
        - label: model runtime
        - label: storage
        - label: other (describe in notes)

  - type: textarea
    id: expected_ports
    attributes:
      label: Expected ports
      description: List host or container ports you expect the template to document.
      placeholder: e.g. 11434/tcp for API, 8080/tcp for UI
    validations:
      required: false

  - type: textarea
    id: expected_data_dirs
    attributes:
      label: Expected data directories
      placeholder: e.g. model cache, uploads, config
    validations:
      required: false

  - type: textarea
    id: why_add
    attributes:
      label: Why should this app be considered?
      description: What problem would a template solve for self-hosted users or maintainers?
    validations:
      required: true

  - type: dropdown
    id: can_help_test
    attributes:
      label: Can you help test on a clean VPS?
      options:
        - "yes"
        - "no"
        - maybe
    validations:
      required: true

  - type: checkboxes
    id: target_os
    attributes:
      label: Target OS tested or planned
      options:
        - label: Debian 12
        - label: Ubuntu 22.04 LTS
        - label: Ubuntu 24.04 LTS
        - label: other (describe in notes)

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Optional context, links, or constraints.
    validations:
      required: false
