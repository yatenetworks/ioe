services:
  litellm-basic:
    image: litellm/litellm:v1.17.8
    container_name: ioe-litellm-basic
    restart: unless-stopped
    command:
      - --config
      - /app/litellm.config.yaml
      - --port
      - "4000"
    ports:
      - "127.0.0.1:18087:4000"
    environment:
      LITELLM_MASTER_KEY: ioe-litellm-local-test-placeholder
      OPENAI_API_KEY: not-configured
    volumes:
      - ./data:/app/data
    configs:
      - source: litellm_config
        target: /app/litellm.config.yaml
    labels:
      ioe.module_id: "litellm.basic"

configs:
  litellm_config:
    content: |
      model_list:
        - model_name: example-openai
          litellm_params:
            model: openai/gpt-3.5-turbo
            api_key: os.environ/OPENAI_API_KEY
      general_settings:
        master_key: os.environ/LITELLM_MASTER_KEY
